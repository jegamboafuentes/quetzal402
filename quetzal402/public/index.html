<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal402</title>
    <script type="importmap">
    {
        "imports": {
            "ethers": "https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm",
            "@x402/client": "./x402-client.js"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: #0b0f12;
            color: #d4af37;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 8px 12px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 8px;
        }
        canvas {
            border: 4px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            display: block;
        }
        #game-wrap {
            position: relative;
            display: inline-block;
            flex: 0 0 auto;
            width: 640px;
            max-width: 100%;
            min-height: 480px;
        }
        #game {
            width: 640px;
            max-width: 100%;
            min-height: 480px;
        }
        .ui-container {
            margin-top: 8px;
            width: min(640px, 100%);
        }
        button {
            background-color: #1f4d29;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2a6638; }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #boost-btn:disabled {
            cursor: wait;
        }
        #start-btn.locked,
        #restart-btn.locked,
        #start-btn:disabled,
        #restart-btn:disabled {
            opacity: 0.38;
            filter: grayscale(0.45);
            cursor: not-allowed;
        }
        #withdraw-btn.locked,
        #withdraw-btn:disabled {
            opacity: 0.38;
            filter: grayscale(0.45);
            box-shadow: none;
        }
        #withdraw-btn.unlocked:not(:disabled) {
            border-color: #f4e27a;
            color: #fff6c8;
            background-color: #2f6b38;
            box-shadow: 0 0 16px rgba(255, 215, 80, 0.9), 0 0 34px rgba(140, 200, 255, 0.45);
            animation: prize-pulse 1.3s ease-in-out infinite;
        }
        @keyframes prize-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        #thunder-overlay {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 40;
            opacity: 0;
            background: transparent;
        }
        #thunder-overlay.active {
            animation: thunder-flash 1.15s ease-out;
        }
        @keyframes thunder-flash {
            0%, 100% { opacity: 0; background: transparent; }
            6% { opacity: 1; background: rgba(255, 255, 255, 0.88); }
            12% { opacity: 0.15; background: rgba(180, 220, 255, 0.2); }
            18% { opacity: 1; background: rgba(210, 235, 255, 0.8); }
            28% { opacity: 0.1; }
            42% { opacity: 0.85; background: rgba(212, 175, 55, 0.38); }
            58% { opacity: 0; }
        }
        .thunder-bolt {
            position: absolute;
            top: 0;
            width: 72px;
            height: 280px;
            opacity: 0;
            fill: #f8fbff;
            filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #8ec8ff);
        }
        #thunder-overlay.active .bolt-left {
            left: 18%;
            animation: bolt-strike 0.5s ease-out 0.04s;
        }
        #thunder-overlay.active .bolt-right {
            right: 16%;
            animation: bolt-strike 0.55s ease-out 0.16s;
        }
        @keyframes bolt-strike {
            0% { opacity: 0; transform: translateY(-50px) scaleY(0.35); }
            18% { opacity: 1; transform: translateY(0) scaleY(1); }
            100% { opacity: 0; transform: translateY(18px) scaleY(1); }
        }
        body.thunder-rumble {
            animation: rumble 0.4s linear 2;
        }
        @keyframes rumble {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-7px, 3px); }
            40% { transform: translate(6px, -2px); }
            60% { transform: translate(-4px, 2px); }
            80% { transform: translate(5px, -1px); }
        }
        #status {
            min-height: 1.4em;
            margin-top: 8px;
            color: #9ad1a8;
        }
        .network-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .network-select {
            background-color: #101816;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .network-badge {
            display: inline-block;
            min-width: 92px;
            padding: 6px 12px;
            border: 2px solid currentColor;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .network-badge.testnet {
            color: #3cb371;
            box-shadow: 0 0 14px rgba(60, 179, 113, 0.55);
        }
        .network-badge.mainnet {
            color: #d4af37;
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.7);
        }
        body[data-network="base"] canvas {
            border-color: #d4af37;
        }
        body[data-network="base-sepolia"] canvas {
            border-color: #3cb371;
        }
        #game-overlay {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(11, 15, 18, 0.78);
            z-index: 3;
        }
        #game-overlay.hidden {
            display: none;
        }
        #overlay-title {
            margin: 0;
            font-size: 28px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }
        #overlay-message {
            margin: 0;
            max-width: 420px;
            font-size: 15px;
            line-height: 1.45;
            color: #9ad1a8;
        }
        #overlay-message.warn {
            color: #f0c674;
        }
        #overlay-message.success {
            color: #9ad1a8;
        }
        #overlay-message.error {
            color: #e08a8a;
        }
        #overlay-message[hidden] {
            display: none;
        }
        .ledger-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 18px;
            margin: 6px 0 8px;
            padding: 8px 12px;
            border: 1px solid rgba(212, 175, 55, 0.45);
            text-align: left;
            font-size: 13px;
        }
        .ledger-board p {
            margin: 0;
        }
        #last-collector {
            font-size: 12px;
            word-break: break-all;
        }
        .boost-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .wallet-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 4px 0 6px;
        }
        #wallet-address {
            font-size: 13px;
        }
        #wallet-connect-btn {
            padding: 6px 14px;
            font-size: 14px;
        }
        #deposit-amount {
            width: 72px;
            background-color: #101816;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="thunder-overlay" aria-hidden="true">
        <svg class="thunder-bolt bolt-left" viewBox="0 0 64 240" xmlns="http://www.w3.org/2000/svg">
            <polygon points="36,0 12,92 28,92 8,240 52,108 34,108 56,0"/>
        </svg>
        <svg class="thunder-bolt bolt-right" viewBox="0 0 64 240" xmlns="http://www.w3.org/2000/svg">
            <polygon points="28,0 48,88 32,88 56,240 16,112 32,112 8,0"/>
        </svg>
    </div>
    <h1>Quetzal402: The Feathered Ledger</h1>
    <div id="game-wrap">
        <div id="game"></div>
        <div id="game-overlay">
            <p id="overlay-title">Quetzalcoatl Approaches...</p>
            <p id="overlay-message" hidden></p>
            <button id="start-btn" type="button" class="locked" disabled title="Boost the vault with USDC to start the game.">Start</button>
            <button id="restart-btn" type="button" hidden>Restart</button>
        </div>
    </div>
    <div class="ui-container">
        <div class="wallet-bar">
            <p>Wallet: <span id="wallet-balance">Not connected</span></p>
            <span id="wallet-address"></span>
            <button id="wallet-connect-btn" type="button">Connect Wallet</button>
        </div>
        <p>Prize Vault: <span id="vault-total">0.00 USDC</span> <span id="vault-address"></span></p>
        <div class="ledger-board">
            <p>Current record: <span id="current-record">0</span></p>
            <p>Last record: <span id="last-record">—</span></p>
            <p>Amount: <span id="last-amount">—</span></p>
            <p>Collected by: <span id="last-collector">—</span></p>
        </div>
        <div class="network-bar">
            <label for="network-select">Network</label>
            <select id="network-select" class="network-select">
                <option value="base-sepolia">Base Sepolia Testnet</option>
                <option value="base">Base Mainnet (Real USDC)</option>
            </select>
            <span id="network-badge" class="network-badge testnet">Testnet</span>
        </div>
        <div class="boost-row">
            <label for="deposit-amount">USDC</label>
            <input type="number" id="deposit-amount" value="1" min="1" step="1">
            <button id="boost-btn" type="button">Boost Vault (1 Testnet USDC)</button>
            <button id="withdraw-btn" type="button" class="locked" disabled title="Beat the current record to unlock withdraw">Withdraw Prize</button>
        </div>
        <p id="status"></p>
    </div>
    <script src="game.js"></script>
    <script type="module">
        import { BrowserProvider, Contract, formatUnits } from 'ethers';
        import {
            NETWORKS,
            USDC_ABI,
            createX402Client,
            depositUrl,
            ensureWalletOnNetwork,
            getSelectedNetwork,
            readUsdcBalanceFromRpc,
            setSelectedNetwork,
        } from '@x402/client';

        const boostBtn = document.getElementById('boost-btn');
        const withdrawBtn = document.getElementById('withdraw-btn');
        const walletConnectBtn = document.getElementById('wallet-connect-btn');
        const walletBalanceEl = document.getElementById('wallet-balance');
        const walletAddressEl = document.getElementById('wallet-address');
        const statusEl = document.getElementById('status');
        const depositAmountInput = document.getElementById('deposit-amount');
        const networkSelect = document.getElementById('network-select');
        let connectedAddress = null;

        function setStatus(message) {
            if (statusEl) {
                statusEl.textContent = message;
            }
        }

        function shortenAddress(address) {
            if (!address) {
                return '';
            }
            return `${address.slice(0, 6)}…${address.slice(-4)}`;
        }

        function setWalletUi(address, balanceText = 'Not connected') {
            connectedAddress = address || null;
            if (walletBalanceEl) {
                walletBalanceEl.textContent = address ? balanceText : 'Not connected';
                walletBalanceEl.title = address || 'Connect your wallet';
            }
            if (walletAddressEl) {
                walletAddressEl.textContent = address ? shortenAddress(address) : '';
                walletAddressEl.title = address || '';
            }
            if (walletConnectBtn) {
                walletConnectBtn.textContent = address ? 'Disconnect' : 'Connect Wallet';
            }
        }

        function readDepositAmount() {
            const parsed = Number(depositAmountInput?.value);
            if (!Number.isFinite(parsed) || parsed < 1) {
                return 1;
            }
            return Math.floor(parsed);
        }

        async function readUsdcBalance(address, networkId) {
            const network = NETWORKS[networkId];

            if (window.ethereum) {
                try {
                    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                    if (String(chainId).toLowerCase() === network.chainIdHex.toLowerCase()) {
                        const provider = new BrowserProvider(window.ethereum);
                        return await new Contract(network.usdc, USDC_ABI, provider).balanceOf(address);
                    }
                } catch {
                    // MetaMask RPC can fail while reconnecting; fall back to public RPC.
                }
            }

            return readUsdcBalanceFromRpc(address, networkId);
        }

        async function refreshWalletBalance({ request = false, quiet = false } = {}) {
            if (!window.ethereum) {
                setWalletUi(null, 'No wallet');
                return null;
            }

            const accounts = await window.ethereum.request({
                method: request ? 'eth_requestAccounts' : 'eth_accounts',
            });
            if (!accounts?.length) {
                setWalletUi(null);
                return null;
            }

            const networkId = getSelectedNetwork();
            const network = NETWORKS[networkId];
            const address = accounts[0];

            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                const onSelectedNetwork = String(chainId).toLowerCase() === network.chainIdHex.toLowerCase();

                if (!onSelectedNetwork) {
                    setWalletUi(address, `Switch to ${network.name}`);
                    return address;
                }

                const raw = await readUsdcBalance(address, networkId);
                setWalletUi(address, `${Number(formatUnits(raw, 6)).toFixed(2)} USDC`);
            } catch (err) {
                setWalletUi(address, 'Balance unavailable');
                if (!quiet) {
                    setStatus('Could not read wallet balance. Check MetaMask network or try again.');
                }
            }

            return address;
        }

        async function refreshBalancesAfterTx() {
            for (const delay of [0, 2000, 5000]) {
                if (delay) {
                    await new Promise((resolve) => setTimeout(resolve, delay));
                }
                await refreshWalletBalance({ quiet: true }).catch(() => {});
                window.refreshVault?.();
            }
        }

        window.quetzalGetSelectedNetwork = getSelectedNetwork;
        window.quetzalSetSelectedNetwork = setSelectedNetwork;
        window.refreshWalletBalance = refreshWalletBalance;

        async function getConnectedWallet({ request = false } = {}) {
            const address = await refreshWalletBalance({ request });
            if (!address) {
                throw new Error('Connect your wallet first.');
            }
            return address;
        }

        async function connectWallet() {
            const address = await getConnectedWallet({ request: true });
            setStatus(`Connected ${shortenAddress(address)}`);
            return address;
        }

        async function disconnectWallet() {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_revokePermissions',
                        params: [{ eth_accounts: {} }],
                    });
                } catch {
                    // Some wallets ignore revoke; the UI still disconnects locally.
                }
            }
            setWalletUi(null);
            setStatus('Wallet disconnected.');
        }

        async function withdrawPrize() {
            const networkId = getSelectedNetwork();
            const walletAddress = await getConnectedWallet({ request: true });
            await ensureWalletOnNetwork(window.ethereum, networkId);

            const res = await fetch('/api/vault/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    walletAddress,
                    network: networkId,
                }),
            });
            const data = await res.json().catch(() => ({}));
            if (typeof window.applyVaultState === 'function') {
                window.applyVaultState(data);
            }

            if (!res.ok || !data.paid) {
                throw new Error(data.message || `Withdraw failed (${res.status})`);
            }

            await refreshWalletBalance();
            refreshBalancesAfterTx().catch(() => {});
            setStatus(data.message || 'Prize withdrawn.');
            return data;
        }

        window.getConnectedWallet = getConnectedWallet;
        window.withdrawPrize = withdrawPrize;

        walletConnectBtn?.addEventListener('click', () => {
            const action = connectedAddress ? disconnectWallet() : connectWallet();
            action.catch((err) => {
                setStatus(err.shortMessage || err.message || 'Wallet connection failed.');
            });
        });

        networkSelect?.addEventListener('change', () => {
            setSelectedNetwork(networkSelect.value);
            refreshWalletBalance({ quiet: true }).catch(() => {});
            window.refreshVault?.();
        });

        if (window.ethereum) {
            refreshWalletBalance({ quiet: true }).catch(() => {});
            window.ethereum.on?.('accountsChanged', (accounts) => {
                if (!accounts?.length) {
                    setWalletUi(null);
                    return;
                }
                refreshWalletBalance({ quiet: true }).catch(() => {});
            });
            window.ethereum.on?.('chainChanged', () => {
                refreshWalletBalance({ quiet: true }).catch(() => {});
                window.refreshVault?.();
            });
        }

        boostBtn.addEventListener('click', async () => {
            if (!window.ethereum) {
                setStatus('Install a browser wallet like MetaMask to boost the vault.');
                return;
            }

            const networkId = getSelectedNetwork();
            const network = NETWORKS[networkId];
            const userAmount = readDepositAmount();
            const tokenLabel = networkId === 'base' ? 'USDC' : 'Testnet USDC';
            const idleLabel = `Boost Vault (${userAmount} ${tokenLabel})`;
            boostBtn.disabled = true;
            boostBtn.textContent = `Boosting ${userAmount} ${tokenLabel}...`;
            setStatus('Connecting wallet...');

            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                await ensureWalletOnNetwork(window.ethereum, networkId);
                await refreshWalletBalance();

                const provider = new BrowserProvider(window.ethereum);
                const walletNetwork = await provider.getNetwork();
                if (Number(walletNetwork.chainId) !== network.chainId) {
                    throw new Error(`Wallet is not on ${network.name}. Please switch networks and try again.`);
                }

                const signer = await provider.getSigner();
                const client = await createX402Client(signer);

                setStatus(`Sending ${userAmount} ${tokenLabel} on ${network.name}...`);
                const res = await client.fetch(depositUrl(networkId), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-payment-network': networkId,
                    },
                    body: JSON.stringify({ amount: userAmount }),
                });
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    setStatus(data.error || data.message || `Boost failed (${res.status})`);
                    return;
                }

                if (typeof window.applyVaultState === 'function') {
                    window.applyVaultState(data);
                }
                await refreshWalletBalance();
                refreshBalancesAfterTx().catch(() => {});
                setStatus(data.message || 'The vault was boosted.');
            } catch (err) {
                const message = err.shortMessage || err.message || 'Boost failed.';
                setStatus(message.includes('revert') ? 'Boost failed. Check MetaMask is connected to Base Sepolia.' : message);
            } finally {
                boostBtn.disabled = false;
                boostBtn.textContent = idleLabel;
            }
        });

        withdrawBtn?.addEventListener('click', async () => {
            if (!window.ethereum) {
                setStatus('Install a browser wallet like MetaMask to withdraw.');
                return;
            }

            withdrawBtn.disabled = true;
            const idleLabel = withdrawBtn.textContent;
            withdrawBtn.textContent = 'Withdrawing...';
            setStatus('Connecting wallet...');

            try {
                const data = await withdrawPrize();
                setStatus(data.message || 'Withdraw complete.');
            } catch (err) {
                setStatus(err.shortMessage || err.message || 'Withdraw failed.');
            } finally {
                withdrawBtn.textContent = 'Withdraw Prize';
                if (typeof window.syncWithdrawButton === 'function') {
                    window.syncWithdrawButton();
                }
            }
        });
    </script>
</body>
</html>
