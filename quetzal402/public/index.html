<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal402</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body {
            background-color: #0b0f12;
            color: #d4af37;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
        .ui-container {
            margin-bottom: 10px;
        }
        button {
            background-color: #1f4d29;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2a6638; }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        #status {
            min-height: 1.4em;
            margin-top: 8px;
            color: #9ad1a8;
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <h1>Quetzal402: The Feathered Ledger</h1>
        <p>Current Vault: <span id="vault-total">0.00 USDC</span></p>
        <button id="boost-btn">Boost Vault (1 USDC)</button>
        <p id="status"></p>
    </div>
    <div id="game"></div>
    <script src="game.js"></script>
</body>
</html>
