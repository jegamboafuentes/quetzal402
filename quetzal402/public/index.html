<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal402</title>
    <script type="importmap">
    {
        "imports": {
            "ethers": "https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm",
            "@x402/client": "./x402-client.js"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body {
            background-color: #0b0f12;
            color: #d4af37;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
        .ui-container {
            margin-bottom: 10px;
        }
        button {
            background-color: #1f4d29;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2a6638; }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        #status {
            min-height: 1.4em;
            margin-top: 8px;
            color: #9ad1a8;
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <h1>Quetzal402: The Feathered Ledger</h1>
        <p>Current Vault: <span id="vault-total">0.00 USDC</span></p>
        <button id="boost-btn">Boost Vault (1 USDC)</button>
        <p id="status"></p>
    </div>
    <div id="game"></div>
    <script src="game.js"></script>
    <script type="module">
        import { BrowserProvider } from 'ethers';
        import { createX402Client } from '@x402/client';

        const BASE_CHAIN_ID = '0x2105';
        const boostBtn = document.getElementById('boost-btn');
        const vaultTotalEl = document.getElementById('vault-total');
        const statusEl = document.getElementById('status');

        function setStatus(message) {
            if (statusEl) {
                statusEl.textContent = message;
            }
        }

        async function ensureBaseNetwork() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: BASE_CHAIN_ID }],
                });
            } catch (err) {
                if (err.code !== 4902) {
                    throw err;
                }
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: BASE_CHAIN_ID,
                        chainName: 'Base',
                        nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
                        rpcUrls: ['https://mainnet.base.org'],
                        blockExplorerUrls: ['https://basescan.org'],
                    }],
                });
            }
        }

        boostBtn.addEventListener('click', async () => {
            if (!window.ethereum) {
                setStatus('Install a browser wallet like MetaMask to boost the vault.');
                return;
            }

            boostBtn.disabled = true;
            setStatus('Connecting wallet...');

            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                await ensureBaseNetwork();

                const provider = new BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const client = await createX402Client(signer);

                setStatus('Sending 1 USDC on Base...');
                const res = await client.fetch('/api/vault/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                });
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    setStatus(data.error || data.message || `Boost failed (${res.status})`);
                    return;
                }

                if (data.vaultTotal != null) {
                    vaultTotalEl.textContent = `${Number(data.vaultTotal).toFixed(2)} USDC`;
                } else {
                    vaultTotalEl.textContent = 'Vault boosted';
                }
                setStatus(data.message || 'The vault was boosted.');
            } catch (err) {
                setStatus(err.shortMessage || err.message || 'Boost failed.');
            } finally {
                boostBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
